[tools]
tinytex = "2026.08"

[tasks.setup]
description = "Install the LaTeX packages used by the CV"
run = '''
tlmgr update --self
tlmgr install latexmk carlito geometry xcolor enumitem ragged2e microtype needspace hyperref eso-pic tagpdf
'''

[tasks.build]
description = "Render the CV to output/pdf/Cedric_Specht.pdf"
depends = ["setup"]
run = '''
mkdir -p build output/pdf
latexmk -pdf \
  -interaction=nonstopmode \
  -halt-on-error \
  -file-line-error \
  -outdir=build \
  cv.tex
cp build/cv.pdf output/pdf/Cedric_Specht.pdf
'''

[tasks.site]
description = "Build the GitHub Pages site in build/site"
depends = ["build"]
run = '''
mkdir -p build/site
cp site/index.html build/site/index.html
cp output/pdf/Cedric_Specht.pdf build/site/Cedric_Specht.pdf
'''

[tasks.clean]
description = "Remove generated LaTeX and PDF files"
run = '''
latexmk -C -outdir=build cv.tex
rm -rf build/site
rm -f output/pdf/Cedric_Specht.pdf
'''
