name: Render CV

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Render PDF
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install mise tools
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Build CV
        run: mise run build

      - name: Upload rendered CV
        uses: actions/upload-artifact@v7
        with:
          name: Cedric-Specht-CV-${{ github.sha }}
          path: output/pdf/Cedric_Specht.pdf
          if-no-files-found: error
          retention-days: 30
